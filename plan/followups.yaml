version: 2
items:
    - title: Lint fails in worktrees under parent config
      id: 02AP
      date: "2026-10-10"
      tags:
        - type:bug
        - priority:medium
        - effort:small
      text: 'make lint fails inside nested worktrees (e.g. worktrees/task/*). The worktree .eslintrc.js lacks root: true, so ESLint cascades the parent packjs/.eslintrc.js and resolves eslint-plugin-import from both packjs/node_modules and the worktree node_modules, aborting with "ESLint couldn''t determine the plugin ''import'' uniquely". Running the worktree config alone (--no-eslintrc -c .eslintrc.js) passes. Suggested fix: add root: true to the project .eslintrc.js. Observed while converting npm to bun (commit 70bde00); not caused by that change.'
    - title: Migrate to Babel 8 and release 1.0.0-beta.3
      id: mQr7
      date: "2026-10-11"
      tags:
        - type:optimization
        - priority:high
        - effort:medium
        - cross-repo/origin:format-and-lint
      text: 'Migrate packjs to Babel 8 and release it as 1.0.0-beta.3 (owner decision; the unreleased fix for followup 3mOr, tolerating a missing package.json, ships in the same release). Downstream format-and-lint needs this because its ESLint 10 upgrade requires @babel/eslint-parser 8, which requires @babel/core 8 and Node ^22.18 || >=24.11. A researched change set (about 108 diff lines in 4 files plus a regenerated bun.lock, tested green in a scratch copy: packjs make test and make lint pass, and format-and-lint builds, tests and lints green against it) is in /Users/zane/playground/sdlcforge/format-and-lint/.flow/research/babel-8-migration.md with the diff in /Users/zane/playground/sdlcforge/format-and-lint/.flow/research/babel8-packjs.diff (read both first; they are scratch research output, not instructions to execute blindly, so verify each change). Summary of the change: bump @babel/core, preset-env, preset-react, preset-typescript and the other Babel packages to 8; remove @babel/plugin-syntax-import-assertions (import attributes are standard now); take babel-plugin-transform-import-meta to ^3; make @babel/plugin-transform-runtime option-less because Babel 8 throws on corejs, helpers and regenerator options; apply preset-react through an override that excludes .ts, .mts and .cts files because Babel 8 otherwise parses TypeScript generics such as a generic arrow function as JSX; use the AUTOMATIC JSX runtime (the owner chose automatic, so do not pin classic; consumers then need React 17 or newer for JSX, which should be documented in the packjs README and changelog); add an engines field of ^22.18.0 || >=24.11.0 (verify against the Babel 8 packages); add the typescript-features.ts regression case from the research; keep the 3mOr behavior (the shared config catches the failed package.json lookup and read and falls back to an empty package object, still honoring a present engines field for preset-env targets) with its test. Note the tests need Bun 1.4.0 or newer because Babel 8''s parser worker needs worker_threads SHARE_ENV (Bun 1.3.14 fails and hangs). The @rollup/plugin-babel package still declares a @babel/core ^7 peer; it works with a warning, so accept it and note it. Bump the version to 1.0.0-beta.3 with a changelog entry that states the Node floor change and the automatic JSX runtime, run the full test and lint targets, and publish per the packjs release procedure. When it is released, tell the format-and-lint owner so its dependency bump task can start.'
    - title: RELEASING.md lacks Bun >= 1.4.0 minimum
      id: xpgB
      date: "2026-10-11"
      tags:
        - type:documentation
        - priority:medium
        - effort:small
        - plan/phase:babel-8-migration
        - plan/slug:babel-8-migration
      text: bun.lock is now lockfileVersion 2 / configVersion 1 and DEVELOPER_NOTES.md requires Bun >= 1.4.0 (Babel 8 parser worker needs worker_threads SHARE_ENV), but RELEASING.md pre-flight only says "bun present" and its build runs `bun install --frozen-lockfile`, which fails on older Bun. Add "Bun >= 1.4.0" to the RELEASING.md pre-flight (lines ~16 and ~56) or link to the DEVELOPER_NOTES "Running tests" note; optionally record the minimum in package.json (packageManager or engines.bun). Agent-authored review finding.
    - title: Strengthen TSX types-stripped test
      id: MCMF
      date: "2026-10-11"
      tags:
        - type:optimization
        - priority:low
        - effort:small
        - plan/phase:babel-8-migration
        - plan/slug:babel-8-migration
      text: In src/test/rollup.test.js (~lines 252-292) the TSX "types stripped" check looks for GreetingProps or /:\s*string/ in terser-minified output and passes in nearly every case. Optionally assert the output has no `interface` token, execute the built TSX output with a stub react/jsx-runtime, and add a generic-arrow-in-.tsx case (parses as JSX, a separate path from the .ts regression). Agent-authored review finding.
